<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#111">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#fff"/>
  <text x="20" y="30" font-size="15" font-family="Consolas, Menlo, monospace">int[][] m = new int[3][4];</text>

  <!-- variable m -->
  <rect x="20" y="140" width="64" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="52" y="168" text-anchor="middle" font-size="16" font-weight="700" font-family="Consolas, Menlo, monospace">m</text>
  <line x1="86" y1="162" x2="146" y2="162" stroke="#111" stroke-width="2" marker-end="url(#arr)"/>

  <!-- outer array -->
  <g stroke="#111" stroke-width="2" fill="#f1f1f1">
    <rect x="150" y="72" width="90" height="60"/>
    <rect x="150" y="132" width="90" height="60"/>
    <rect x="150" y="192" width="90" height="60"/>
  </g>
  <g font-size="13" font-family="Consolas, Menlo, monospace" fill="#444">
    <text x="160" y="92">m[0]</text><text x="160" y="152">m[1]</text><text x="160" y="212">m[2]</text>
  </g>
  <g fill="#111"><circle cx="218" cy="110" r="5"/><circle cx="218" cy="170" r="5"/><circle cx="218" cy="230" r="5"/></g>
  <text x="195" y="272" text-anchor="middle" font-size="12" fill="#888">масив от референции</text>

  <!-- arrows to rows -->
  <g stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M218 110 C 270 110, 280 72, 338 72"/>
    <path d="M218 170 C 290 170, 320 150, 378 150"/>
    <path d="M218 230 C 270 230, 290 228, 348 228"/>
  </g>

  <!-- rows -->
  <g stroke="#111" stroke-width="2" fill="#fff">
    <rect x="340" y="50" width="70" height="44"/><rect x="410" y="50" width="70" height="44"/><rect x="480" y="50" width="70" height="44"/><rect x="550" y="50" width="70" height="44"/>
    <rect x="380" y="128" width="70" height="44"/><rect x="450" y="128" width="70" height="44"/><rect x="520" y="128" width="70" height="44" fill="#111"/><rect x="590" y="128" width="70" height="44"/>
    <rect x="350" y="206" width="70" height="44"/><rect x="420" y="206" width="70" height="44"/><rect x="490" y="206" width="70" height="44"/><rect x="560" y="206" width="70" height="44"/>
  </g>
  <g font-size="17" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="375" y="78">0</text><text x="445" y="78">0</text><text x="515" y="78">0</text><text x="585" y="78">0</text>
    <text x="415" y="156">0</text><text x="485" y="156">0</text><text x="555" y="156" fill="#fff" font-weight="700">7</text><text x="625" y="156">0</text>
    <text x="385" y="234">0</text><text x="455" y="234">0</text><text x="525" y="234">0</text><text x="595" y="234">0</text>
  </g>
  <text x="555" y="190" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Consolas, Menlo, monospace">m[1][2] = 7</text>

  <text x="360" y="296" text-anchor="middle" font-size="13" fill="#444">Всеки ред е отделен масив на свое място в паметта</text>
</svg>
